<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07131d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Brevet Cue v0.4</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#07131d;--panel:#102432;--fg:#f5f7f9;--muted:#9fb3c2;--accent:#35a7ff;--pc:#19b79a;--paper:#eef3f6;--ink:#0d1820}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;min-height:100vh}.app{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(12px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}.title{font-weight:850}.sub,.help{font-size:12px;color:var(--muted)}button,input,select,textarea{font:inherit}.tools{display:flex;gap:7px}.small,.tab,.btn{border:0;color:#fff;background:#173345;border-radius:12px;padding:11px 13px;font-weight:750}.small.primary,.btn.primary,.tab.active{background:#087bd1}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.panel{display:none}.panel.active{display:block}.roll{background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0008}.cue{display:grid;grid-template-columns:92px 70px 1fr;min-height:108px;border-bottom:1px solid #cbd5dc;align-items:center;padding:8px}.cue.current{background:#bde2ff}.cue.pc.current{background:#b8f1e7}.km{font-size:24px;font-weight:900}.seg{font-size:11px;color:#546570}.dir{font-size:48px;text-align:center;font-weight:900}.desc{font-size:18px;font-weight:850}.note{font-size:12px;color:#455761;margin-top:5px}.pc .dir{font-size:17px;color:#fff;background:#155b94;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;margin:auto}.footer{display:grid;grid-template-columns:1fr 1fr 1fr;background:#09151e;color:#fff;padding:12px 6px;text-align:center}.footer b{display:block;font-size:17px}.footer span{font-size:10px;color:#a8bbc7}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{padding:18px;font-size:18px}.detail{background:#f8fafb;color:#111;border-radius:18px;padding:18px;margin-top:12px}.bigkm{font-size:44px;font-weight:900;text-align:center}.bigdir{font-size:88px;font-weight:900;text-align:center;line-height:1.1}.bigdesc{text-align:center;font-size:25px;font-weight:900}.warn,.pcbox{padding:12px;border-radius:12px;margin-top:14px}.warn{background:#dcefff}.pcbox{background:#e7faf5}.times{display:flex;justify-content:space-around;text-align:center}.times b{font-size:24px}.card{background:#102432;border-radius:16px;padding:14px;margin-bottom:10px}.eventrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.eventrow b{font-size:18px}.form{display:grid;gap:9px}.form label{font-size:12px;color:#b7c7d2}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid #355064;background:#09151e;color:#fff;border-radius:11px}.form textarea{min-height:74px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editlist{display:grid;gap:7px;margin-top:10px}.editcue{background:#0b1d29;border:1px solid #244457;border-radius:12px;padding:11px;display:grid;grid-template-columns:65px 45px 1fr auto;align-items:center;gap:7px}.editcue .mini{font-size:11px;color:#9fb3c2}.danger{background:#692a2a}.success{background:#16735f}.help{text-align:center;margin-top:10px}.ridebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}.focus{display:none;background:#eef3f6;color:#0d1820;border-radius:18px;min-height:72vh;padding:18px 16px;text-align:center;align-content:center;position:relative}.focusTop{display:flex;justify-content:space-between;align-items:center;position:absolute;top:14px;left:16px;right:16px;font-weight:850}.focusExit{border:0;border-radius:11px;background:#173345;color:#fff;padding:9px 12px;font-weight:850}.focusStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.focusStat{background:#dce6ec;border-radius:12px;padding:10px}.focusStat span{display:block;font-size:11px;color:#536874}.focusStat b{font-size:18px}.focusTimer{margin-top:12px;display:flex;justify-content:center;gap:8px}.focusTimer button{border:0;border-radius:12px;padding:12px 18px;font-weight:850;background:#087bd1;color:#fff}.focus.active{display:grid}.focus .fkm{font-size:52px;font-weight:950}.focus .fdir{font-size:110px;font-weight:950;line-height:1}.focus .fdesc{font-size:29px;font-weight:950}.focus .fnote{font-size:16px;color:#455761;margin-top:10px}.focus .fmeta{margin-top:18px;font-size:16px;font-weight:800}.focus .ftime{font-size:18px;margin-bottom:8px}.ride.full .roll,.ride.full .ridebar,.ride.full #detail,.ride.full>.help{display:none}.ride.full .focus{display:grid}.ride.full .controls{margin-top:10px}.ride.full .controls .btn{padding:22px;font-size:22px}body.focusActive .top,body.focusActive .tabs{display:none}body.focusActive .app{padding-top:calc(env(safe-area-inset-top) + 6px)} .nightpaper .roll,.nightpaper .focus{background:#101b23;color:#f5f7f9}.nightpaper .cue{color:#f5f7f9;border-color:#31434f}.nightpaper .cue.current{background:#193c53}.nightpaper .focusStat{background:#172b38;color:#f5f7f9}.nightpaper .focusStat span{color:#a9bdc9}.nightpaper .cue.pc.current{background:#16453f}.nightpaper .seg,.nightpaper .note,.nightpaper .focus .fnote{color:#a9bdc9}.elapsed{font-variant-numeric:tabular-nums}.empty{padding:30px;text-align:center;color:#9fb3c2}.light{--bg:#e8eef2;--fg:#10202b;--muted:#536874}.light .card{background:#d8e1e7}.light .form input,.light .form select,.light .form textarea,.light .editcue{background:#f8fafb;color:#10202b;border-color:#bac8d1}@media(max-width:430px){.cue{grid-template-columns:78px 58px 1fr}.km{font-size:20px}.dir{font-size:40px}.desc{font-size:16px}.editcue{grid-template-columns:58px 38px 1fr auto}}
</style></head><body><main class="app"><header class="top"><div><div class="title" id="eventTitle">Brevet Cue v0.2</div><div class="sub">手動ロール式・端末内保存</div></div><div class="tools"><button class="small" id="theme">☾</button><button class="small primary" id="detailToggle">詳細</button></div></header><nav class="tabs"><button class="tab active" data-tab="ride">走行</button><button class="tab" data-tab="edit">編集</button><button class="tab" data-tab="data">データ</button></nav>
<section id="ride" class="panel active ride"><div class="ridebar"><button class="small primary" id="rollMode">ROLL</button><button class="small" id="focusMode">FOCUS</button><button class="small" id="startTimer">START</button></div><div class="roll" id="roll"></div><div class="focus" id="focus"></div><div id="detail"></div><div class="controls"><button class="btn" id="prev">← 前</button><button class="btn primary" id="next">次 →</button></div><div class="help">ロールの左側タップ＝戻る / 右側タップ＝進む</div></section>
<section id="edit" class="panel"><div class="card"><div class="form"><label>イベント名<input id="evName"></label><div class="row2"><label>総距離 km<input id="evDist" inputmode="decimal"></label><label>スタート時刻<input id="evStart" type="time"></label></div><button class="small primary" id="saveEvent">イベント情報を保存</button></div></div><div class="card"><b id="formTitle">キュー追加</b><div class="form" style="margin-top:10px"><div class="row2"><label>総距離 km<input id="qKm" inputmode="decimal" placeholder="85.4"></label><label>方向<select id="qDir"><option>↑</option><option>→</option><option>←</option><option>↗</option><option>↖</option><option>PC</option><option>📷</option><option>⚑</option></select></label></div><label>地点・指示<input id="qDesc" placeholder="○○交差点 右折"></label><label>備考<textarea id="qNote" placeholder="右折後200mで橋 など"></textarea></label><div class="row2"><label>種別<select id="qType"><option value="turn">通常</option><option value="pc">PC</option><option value="photo">フォト</option><option value="start">スタート</option><option value="finish">ゴール</option></select></label><label>PC CLOSE<input id="qClose" type="time"></label></div><div class="row2"><button class="small primary" id="saveCue">保存</button><button class="small" id="cancelEdit">クリア</button></div></div></div><div class="card"><b>キュー一覧</b><div id="editList" class="editlist"></div></div></section>
<section id="data" class="panel"><div class="card"><b>バックアップ / 移行</b><p class="sub">JSONは将来の専用機との共通フォーマットを想定しています。</p><div class="controls"><button class="btn primary" id="exportJson">JSONを書き出す</button><button class="btn" id="importJson">JSONを読み込む</button></div><input id="fileInput" type="file" accept="application/json,.json" hidden><div class="controls"><button class="btn" id="loadDemo">デモを復元</button><button class="btn danger" id="clearAll">全消去</button></div></div><div class="card"><b>状態</b><p id="status" class="sub"></p></div></section></main><script>
const DEMO={version:4,event:{name:'BRM926 竹田津300 DEMO',distance:300,start:'10:00'},cues:[{km:0,dir:'↑',desc:'竹田津フェリーターミナル',note:'スタート（デモ）',type:'start'},{km:18.6,dir:'→',desc:'○○交差点 右折',note:'県道へ（デモ）',type:'turn'},{km:42.1,dir:'←',desc:'△△交差点 左折',note:'コンビニ300m（デモ）',type:'turn'},{km:85.4,dir:'→',desc:'国道○号 △△交差点 右折',note:'右折後200mで橋（デモ）',type:'turn'},{km:118.3,dir:'PC',desc:'PC1 ○○店',note:'レシートチェック（デモ）',type:'pc',open:'10:24',close:'16:04'},{km:203.5,dir:'PC',desc:'PC2 △△店',note:'補給・休憩候補（デモ）',type:'pc',open:'15:58',close:'23:34'},{km:257.4,dir:'📷',desc:'フォトチェック',note:'撮影対象はデモです',type:'photo'},{km:300,dir:'⚑',desc:'ゴール',note:'お疲れさまでした',type:'finish'}]};
let data=load(),idx=Number(localStorage.getItem('bc_idx')||0),showDetail=false,editIndex=-1,rideMode=localStorage.getItem('bc_mode')||'roll',timerStart=Number(localStorage.getItem('bc_timer')||0);  idx=Math.min(idx,data.cues.length-1);
function clone(x){return JSON.parse(JSON.stringify(x))} function load(){try{return JSON.parse(localStorage.getItem('bc_data'))||clone(DEMO)}catch(e){return clone(DEMO)}} function persist(){data.cues.sort((a,b)=>a.km-b.km);localStorage.setItem('bc_data',JSON.stringify(data));renderAll()}
function seg(i){return i?Math.max(0,data.cues[i].km-data.cues[i-1].km):0} function nextPC(){let c=data.cues[idx],p=data.cues.slice(idx).find(x=>x.type==='pc'||x.type==='finish');return p?(p.km-c.km).toFixed(1)+' km':'—'}
function fmtElapsed(ms){if(!ms)return '00:00:00';let t=Math.max(0,Math.floor((Date.now()-ms)/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')} function renderRide(){eventTitle.textContent=data.event.name||'Brevet Cue'; if(!data.cues.length){roll.innerHTML='<div class="empty">キューがありません</div>';detail.innerHTML='';return} idx=Math.max(0,Math.min(idx,data.cues.length-1));localStorage.setItem('bc_idx',idx);let from=Math.max(0,idx-2),to=Math.min(data.cues.length,idx+3);roll.innerHTML='';for(let i=from;i<to;i++){let c=data.cues[i],d=document.createElement('div');d.className='cue '+(i===idx?'current ':'')+(c.type==='pc'?'pc':'');d.innerHTML=`<div><div class="km">${Number(c.km).toFixed(1)}<small> km</small></div><div class="seg">区間 ${seg(i).toFixed(1)} km</div></div><div class="dir">${c.dir}</div><div><div class="desc">${esc(c.desc)}</div><div class="note">${esc(c.note||'')}</div></div>`;roll.appendChild(d)}let c=data.cues[idx];roll.insertAdjacentHTML('beforeend',`<div class="footer"><div><span>現在キュー</span><b>${Number(c.km).toFixed(1)} km</b></div><div><span>次PC/ゴール</span><b>${nextPC()}</b></div><div><span>進行</span><b>${idx+1}/${data.cues.length}</b></div></div>`);let closeText='—'; if(c.type==='pc'&&c.close){let [hh,mm]=c.close.split(':').map(Number),now=new Date(),cl=new Date(now);cl.setHours(hh,mm,0,0);let mins=Math.floor((cl-now)/60000);closeText=mins>=0?`${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`:'CLOSED';}
focus.innerHTML=`<div class="focusTop"><span>${esc(data.event.name||'Brevet Cue')}</span><button class="focusExit" id="focusExit">ROLL</button></div><div class="ftime"><span id="clock"></span> ・ 経過 <span class="elapsed" id="elapsed">${fmtElapsed(timerStart)}</span></div><div class="fkm">${Number(c.km).toFixed(1)} km</div><div class="fdir">${c.dir}</div><div class="fdesc">${esc(c.desc)}</div><div class="fnote">${esc(c.note||'')}</div><div class="focusStats"><div class="focusStat"><span>区間距離</span><b>${seg(idx).toFixed(1)} km</b></div><div class="focusStat"><span>次PC/ゴール</span><b>${nextPC()}</b></div>${c.type==='pc'?`<div class="focusStat"><span>PC CLOSE</span><b>${c.close||'—'}</b></div><div class="focusStat"><span>CLOSEまで</span><b>${closeText}</b></div>`:''}</div><div class="focusTimer"><button id="focusTimerBtn">${timerStart?'RESET':'START'}</button></div>`;document.getElementById('ride').classList.toggle('full',rideMode==='focus');document.body.classList.toggle('focusActive',rideMode==='focus');rollMode.classList.toggle('primary',rideMode==='roll');focusMode.classList.toggle('primary',rideMode==='focus');setTimeout(()=>{let x=document.getElementById('focusExit');if(x)x.onclick=()=>{rideMode='roll';localStorage.setItem('bc_mode',rideMode);renderRide()};let t=document.getElementById('focusTimerBtn');if(t)t.onclick=toggleTimer},0);detail.innerHTML=showDetail?`<div class="detail"><div class="bigkm">${Number(c.km).toFixed(1)} km</div><div class="bigdir">${c.dir}</div><div class="bigdesc">${esc(c.desc)}</div><div class="warn">${esc(c.note||'—')}</div>${c.type==='pc'?`<div class="pcbox"><div class="times"><div>OPEN<br><b>${c.open||'—'}</b></div><div>CLOSE<br><b>${c.close||'—'}</b></div></div></div>`:''}</div>`:''}
function renderEdit(){evName.value=data.event.name||'';evDist.value=data.event.distance||'';evStart.value=data.event.start||'';editList.innerHTML=data.cues.map((c,i)=>`<div class="editcue"><b>${Number(c.km).toFixed(1)}</b><b>${c.dir}</b><div><div>${esc(c.desc)}</div><div class="mini">${esc(c.note||'')}</div></div><button class="small" onclick="editCue(${i})">編集</button></div>`).join('')||'<div class="empty">キューがありません</div>'}
function renderAll(){renderRide();renderEdit();status.textContent=`${data.cues.length} cues / 保存先: この端末のブラウザ / Brevet Cue v0.4 / 形式 v${data.version||4}`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function move(n){idx=Math.max(0,Math.min(data.cues.length-1,idx+n));renderRide()}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);rollMode.onclick=()=>{rideMode='roll';localStorage.setItem('bc_mode',rideMode);renderRide()};focusMode.onclick=()=>{rideMode='focus';localStorage.setItem('bc_mode',rideMode);renderRide()};function toggleTimer(){if(timerStart){if(confirm('経過時間をリセットしますか？')){timerStart=0;localStorage.removeItem('bc_timer')}}else{timerStart=Date.now();localStorage.setItem('bc_timer',timerStart)}startTimer.textContent=timerStart?'RESET':'START';renderRide()} startTimer.onclick=toggleTimer;detailToggle.onclick=()=>{showDetail=!showDetail;detailToggle.textContent=showDetail?'ロール':'詳細';renderRide()};theme.onclick=()=>{document.body.classList.toggle('nightpaper');theme.textContent=document.body.classList.contains('nightpaper')?'☀':'☾'};roll.onclick=e=>{let r=roll.getBoundingClientRect(); if(e.clientX-r.left<r.width*.35)move(-1);else if(e.clientX-r.left>r.width*.65)move(1)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
saveEvent.onclick=()=>{data.event={name:evName.value.trim()||'Brevet Cue',distance:Number(evDist.value)||0,start:evStart.value};persist()};
function clearForm(){editIndex=-1;formTitle.textContent='キュー追加';qKm.value='';qDir.value='↑';qDesc.value='';qNote.value='';qType.value='turn';qClose.value=''} cancelEdit.onclick=clearForm;
window.editCue=i=>{let c=data.cues[i];editIndex=i;formTitle.textContent=`キュー編集 #${i+1}`;qKm.value=c.km;qDir.value=c.dir;qDesc.value=c.desc;qNote.value=c.note||'';qType.value=c.type||'turn';qClose.value=c.close||'';window.scrollTo({top:0,behavior:'smooth'})};
saveCue.onclick=()=>{if(qKm.value===''||!qDesc.value.trim())return alert('総距離と地点・指示を入力してください');let c={km:Number(qKm.value),dir:qDir.value,desc:qDesc.value.trim(),note:qNote.value.trim(),type:qType.value};if(c.type==='pc')c.close=qClose.value;if(editIndex>=0)data.cues[editIndex]=c;else data.cues.push(c);clearForm();persist()};
exportJson.onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.event.name||'brevet-cue').replace(/[^a-zA-Z0-9ぁ-んァ-ヶ一-龠_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};importJson.onclick=()=>fileInput.click();fileInput.onchange=async()=>{try{let obj=JSON.parse(await fileInput.files[0].text());if(!obj.event||!Array.isArray(obj.cues))throw 0;data=obj;idx=0;persist();alert('読み込みました')}catch(e){alert('Brevet Cue JSONとして読み込めませんでした')}};loadDemo.onclick=()=>{data=clone(DEMO);idx=0;persist()};clearAll.onclick=()=>{if(confirm('イベントと全キューを消去しますか？')){data={version:4,event:{name:'新規イベント',distance:0,start:''},cues:[]};idx=0;persist()}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');startTimer.textContent=timerStart?'RESET':'START';renderAll();setInterval(()=>{let c=document.getElementById('clock'),e=document.getElementById('elapsed');if(c)c.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});if(e)e.textContent=fmtElapsed(timerStart)},1000);
</script></body></html>
